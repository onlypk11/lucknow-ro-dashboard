async function unlock(pw){
 const b=Uint8Array.from(atob(P),c=>c.charCodeAt(0)),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));
 document.getElementById("lock").remove();document.getElementById("app").innerHTML=o.h;
 const s=document.createElement("script");s.textContent=o.j;document.body.appendChild(s);
 try{sessionStorage.setItem("lkp",pw)}catch(e){}
}
async function tryPw(pw,quiet){const e=document.getElementById("err");e.textContent=quiet?"":"Checking...";
 try{await unlock(pw)}catch(x){if(!quiet)e.textContent="Wrong password. Try again.";try{sessionStorage.removeItem("lkp")}catch(y){}}}
document.getElementById("go").onclick=()=>tryPw(document.getElementById("pw").value,false);
document.getElementById("pw").onkeydown=e=>{if(e.key=="Enter")tryPw(e.target.value,false)};
try{const s=sessionStorage.getItem("lkp");if(s)tryPw(s,true)}catch(e){}
