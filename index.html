:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--tx:#e8ebef;--mu:#98a1ad;--bd:#2a323d;--ac:#6ea0ff;--g:#4ade80;--r:#f87171;--y:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:12px}h1{font-size:18px;margin:4px 0}.n{color:var(--mu);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
select,input{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.c h3{margin:0 0 6px;font-size:12px;color:var(--mu);text-transform:uppercase}
.big{font-size:22px;font-weight:700}h2{font-size:15px;margin:16px 0 8px}
.sc{overflow-x:auto;max-height:520px}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;cursor:pointer;position:sticky;top:0;background:var(--card)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}tr.t td{font-weight:700;background:var(--bg)}.y{color:var(--y)}.g{color:var(--g)}.r{color:var(--r)}
.hero{background:linear-gradient(135deg,#1e3a8a,#0d9488);color:#fff;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:20px;margin:0}.hero .n{color:#dbeafe}.hero .tx{flex:1;min-width:240px}.hl{margin-top:10px;font-size:14px;background:rgba(255,255,255,.16);padding:9px 11px;border-radius:8px}
.kp .c{border-left:4px solid var(--ac)}.c[data-st=g]{border-left-color:var(--g)}.c[data-st=y]{border-left-color:var(--y)}.c[data-st=r]{border-left-color:var(--r)}.hint{font-size:11px;color:var(--mu);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px;margin-bottom:12px}
.br{display:flex;align-items:center;gap:8px;margin:5px 0}.lb{width:118px;font-size:12px;flex:none}.tr{flex:1;position:relative;height:14px;background:var(--bd);border-radius:7px;overflow:hidden}.tr i{display:block;height:100%;border-radius:7px}.mk{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);opacity:.6}.vl{width:64px;font-size:12px;text-align:right;flex:none}
.gh{font-weight:600;margin:10px 0 2px;display:flex;justify-content:space-between}.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}.leg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.pill{padding:2px 8px;border-radius:10px;font-weight:600;font-size:12px;color:#fff}.p-g{background:var(--g)}.p-y{background:var(--y)}.p-r{background:var(--r)}

body{background:linear-gradient(160deg,#eef2ff 0%,#fdf2f8 50%,#ecfeff 100%);background-attachment:fixed}

.kp .c h3{color:rgba(255,255,255,.9);font-size:12px}.kp .c .big{color:#fff!important;font-size:30px}.kp .c .hint{color:rgba(255,255,255,.85);font-size:12px}

.kp .c:nth-child(3){background:linear-gradient(135deg,#0d9488,#2dd4bf)}.kp .c:nth-child(6){background:linear-gradient(135deg,#ea580c,#fb923c)}
.kp .c:nth-child(7){background:linear-gradient(135deg,#9333ea,#c084fc)}
.kp .c[data-st=g]{background:linear-gradient(135deg,#15803d,#4ade80)}.kp .c[data-st=y]{background:linear-gradient(135deg,#d97706,#fbbf24)}.kp .c[data-st=r]{background:linear-gradient(135deg,#dc2626,#fb7185)}
h2{background:linear-gradient(90deg,#4f46e5,#8b5cf6);color:#fff;padding:10px 16px;border-radius:12px;font-size:16px;margin:22px 0 10px;box-shadow:0 4px 12px rgba(79,70,229,.25)}h2 .n{color:#e0e7ff}
.grid2 .c h3{color:var(--ac);font-size:14px;text-transform:none}
.tr{height:18px;border-radius:9px}.tr i{border-radius:9px}.br{margin:7px 0}
th{background:#4338ca!important;color:#fff!important;font-size:12px}
tr:nth-child(even) td{background:rgba(99,102,241,.07)}tr.t td{background:rgba(99,102,241,.22)!important}
.pill{padding:3px 10px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2)}.mb{height:5px}.mb i{background:linear-gradient(90deg,#6366f1,#ec4899)}
